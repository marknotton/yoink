[package]
name = "yoink"
version = "0.1.2"
edition = "2021"

[lib]
name = "yoink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fetched from Rust so GitHub's redirect host (which sends no CORS headers) isn't a problem
tauri-plugin-http = "2"
# Android's web view won't let a page read the clipboard, so the Paste button reads it natively
tauri-plugin-clipboard-manager = "2"

# sidecars and the folder picker are desktop-only; Android uses a Kotlin plugin
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
