# Builds the macOS app (Apple Silicon) on GitHub's Mac runners, so it can be
# built without a Mac (e.g. from the NAS: `gh workflow run mac-build.yml`).
# Runs only on demand or for a v* tag: Mac minutes are limited on private repos.
# Download the result on a Mac with: nas-app get yoink
name: Mac build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: corepack enable && yarn install

      - name: Fetch bundled tools
        run: yarn setup

      # Updater bundles need the private signing key. Without the
      # TAURI_SIGNING_PRIVATE_KEY secret, build a plain (unsigned-update) app.
      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles app
          else
            npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Zip app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "Yoink.app" "$GITHUB_WORKSPACE/yoink-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: yoink-mac
          path: yoink-mac.zip
          retention-days: 14
